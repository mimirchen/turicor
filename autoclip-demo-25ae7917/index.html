<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>AutoClip Demo</title>
<style>:root{--bg:#05070b;--ink:#e8edf4;--mut:#8b97a8;--acc:#3ecf8e;--line:#243040}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:380px}h1{font-size:22px;margin:0 0 6px}p{color:var(--mut);margin:0 0 22px;font-size:14px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0b0f14;color:var(--ink)}
button{margin-top:12px;width:100%;font-size:17px;padding:14px;border-radius:10px;border:0;background:var(--acc);color:#04120b;font-weight:600}
button:disabled{opacity:.5}.bar{height:4px;background:#111823;border-radius:2px;margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
#msg{margin-top:10px;font-size:13px;color:var(--mut);min-height:18px}</style></head><body><main><form class="box" id="f">
<h1>AutoClip · Demo</h1><p>Research prototype · provisional numbers · not for clinical use.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
<button id="go">Open</button><div class="bar"><i id="bar"></i></div><div id="msg"></div></form></main>
<script>
(() => {   // own scope: nothing may leak into the player's globals after document.write
const M = {"chunks": ["payload.000.bin", "payload.001.bin", "payload.002.bin"], "bytes": 47705349, "iter": 600000, "salt": "4Bmbqvay7qNMc58vYvQxmw==", "iv": "HEO3No+6H7VlEr/t"};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), $ = id => document.getElementById(id);
async function fetchAll() {
  const parts = []; let got = 0;
  for (const name of M.chunks) {
    const r = await fetch(name, {cache: 'force-cache'}); if (!r.ok) throw new Error('download ' + name + ' ' + r.status);
    const rd = r.body.getReader(); for (;;) { const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length;
      $('bar').style.width = (90 * got / M.bytes).toFixed(1) + '%'; $('msg').textContent = 'Loading ' + (got / 1e6).toFixed(0) + ' / ' + (M.bytes / 1e6).toFixed(0) + ' MB'; }
  }
  const all = new Uint8Array(got); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; } return all;
}
let cache = null;
$('f').onsubmit = async e => {
  e.preventDefault(); $('go').disabled = true; $('msg').textContent = '';
  try {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('This browser is too old (needs https + Safari 16.4 / Chrome 80 or newer).');
    cache = cache || await fetchAll();
    $('msg').textContent = 'Decrypting…';
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(M.salt), iterations: M.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    let plain; try { plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(M.iv)}, key, cache); } catch (_) { throw new Error('Wrong password.'); }
    $('bar').style.width = '95%'; $('msg').textContent = 'Opening…';
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (err) { $('msg').textContent = err.message; $('go').disabled = false; $('pw').select(); }
};
})();
</script></body></html>
